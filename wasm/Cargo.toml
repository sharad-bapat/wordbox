[package]
name = "wordbox-wasm"
version = "0.1.0"
edition = "2021"
description = "The browser build of wordbox: one call, extract_json(bytes). A separate crate, so the frozen extractor stays untouched."
license = "MIT"

[lib]
crate-type = ["cdylib"]

[dependencies]
wordbox = { path = "../extractor" }
wasm-bindgen = "0.2"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
