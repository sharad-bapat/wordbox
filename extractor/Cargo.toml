[package]
name = "wordbox"
version = "0.1.0"
edition = "2021"
description = "Where is the text? Every word a born-digital PDF draws, with its box. Deterministic, no rendering."
license = "MIT"

[lib]
crate-type = ["cdylib", "rlib"]

[[bin]]
name = "wordbox-cli"
path = "src/main.rs"

[dependencies]
# The PDF reading shared with scan-or-text and where-are-the-regions.
pdf-core = { path = "../../pdf-core" }
# Glyph outlines from embedded TrueType and CFF programs, for ink boxes. Pinned, as in where-are-the-regions.
ttf-parser = { version = "0.25.1", default-features = false, features = ["std", "glyph-names"] }
wasm-bindgen = { version = "0.2", optional = true }

[features]
wasm = ["dep:wasm-bindgen"]

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
